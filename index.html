<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkRead</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.2.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.18/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github-dark.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --sidebar-bg: #f0f4f8;
        --border: #d9e2ec;
        --text: #1f2937;
        --muted: #5b6472;
        --accent: #0f6cbd;
        --accent-contrast: #ffffff;
        --accent-soft: #eaf3ff;
        --accent-border: #bbd7ff;
        --code-bg: #f3f4f6;
        --pre-bg: #111827;
        --pre-text: #f9fafb;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      [data-theme="dark"] {
        --bg: #0f172a;
        --panel: #1e293b;
        --sidebar-bg: #172033;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-contrast: #0f172a;
        --accent-soft: #1e3a5f;
        --accent-border: #2563eb;
        --code-bg: #0b1220;
        --pre-bg: #020617;
        --pre-text: #e2e8f0;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      [data-theme="paper"] {
        --bg: #ebe6d9;
        --panel: #fdfbf4;
        --sidebar-bg: #e4dccb;
        --border: #d6cbb3;
        --text: #3b3121;
        --muted: #7a6b52;
        --accent: #8a4b1f;
        --accent-contrast: #fdf6e3;
        --accent-soft: #f3e7d3;
        --accent-border: #d9b98c;
        --code-bg: #f1ead8;
        --pre-bg: #3b3121;
        --pre-text: #fdf6e3;
        --shadow: 0 4px 16px rgba(80, 60, 30, 0.12);
      }

      [data-theme="paper"] .markdown-body,
      [data-theme="paper"] .doc-header {
        font-family: Georgia, "Times New Roman", serif;
      }

      [data-theme="paper"] .markdown-body {
        font-size: 1.05rem;
      }

      button {
        color: var(--text);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .layout {
        --sidebar-w: 260px;
        --toc-w: 0px;
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .layout.has-toc {
        --toc-w: 260px;
      }

      .sidebar {
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      .sidebar h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
      }

      .search {
        width: 100%;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        margin-bottom: 10px;
      }

      .doc-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .doc-link {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .doc-link-label {
        word-break: break-word;
      }

      .doc-link-icon {
        flex-shrink: 0;
        color: var(--muted);
      }

      .doc-link:hover,
      .doc-link.active {
        background: var(--accent-soft);
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .doc-link:hover .doc-link-icon,
      .doc-link.active .doc-link-icon {
        color: var(--accent);
      }

      .content {
        padding: 28px 32px 48px;
        overflow-y: auto;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .doc-column {
        min-width: 0;
      }

      .content::-webkit-scrollbar {
        width: 8px;
      }

      .content::-webkit-scrollbar-track {
        background: transparent;
      }

      .content::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      .content::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }

      .doc-header {
        max-width: 880px;
        margin: 0 auto 24px;
        padding: 0 4px;
      }

      .doc-header h1 {
        margin: 0;
        font-size: clamp(1.75rem, 2vw, 2.5rem);
        word-break: break-word;
      }

      .markdown-body {
        max-width: 880px;
        margin: 0 auto;
        padding: 4px;
        line-height: 1.7;
      }

      .markdown-body > :first-child { margin-top: 0; }
      .markdown-body > :last-child { margin-bottom: 0; }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        color: var(--text);
        margin-top: 1.5em;
        margin-bottom: 0.6em;
      }

      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body blockquote,
      .markdown-body pre {
        margin-top: 0;
        margin-bottom: 1em;
      }

      .markdown-body a {
        color: var(--accent);
        text-decoration: none;
      }

      .markdown-body a:hover {
        text-decoration: underline;
      }

      .markdown-body code {
        background: var(--code-bg);
        border-radius: 6px;
        padding: 0.2em 0.4em;
        font-size: 0.95em;
      }

      .markdown-body pre {
        overflow: auto;
        background: var(--pre-bg);
        color: var(--pre-text);
        padding: 16px;
        border-radius: 10px;
      }

      .markdown-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .code-block-wrap {
        position: relative;
        margin: 0 0 1em;
      }

      .code-block-wrap pre {
        margin: 0;
      }

      .copy-code-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 4px 10px;
        font-size: 0.78rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--pre-text);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .code-block-wrap:hover .copy-code-btn,
      .copy-code-btn:focus-visible {
        opacity: 1;
      }

      .copy-code-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .toc-panel {
        background: var(--sidebar-bg);
        border-left: 1px solid var(--border);
        padding: 20px 16px;
        overflow-y: auto;
        min-height: 0;
        font-size: 0.85rem;
      }

      .toc-panel strong {
        display: block;
        margin-bottom: 16px;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
      }

      .toc-panel ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      .toc-panel a {
        color: var(--muted);
        text-decoration: none;
        display: block;
        line-height: 1.4;
        word-break: break-word;
      }

      .toc-panel a:hover {
        color: var(--accent);
      }

      .toc-panel .toc-level-1 a {
        font-weight: 600;
        color: var(--text);
      }

      .toc-panel .toc-level-2 { padding-left: 14px; }

      .toc-panel .toc-level-3 {
        padding-left: 28px;
        font-size: 0.92em;
      }

      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1em;
      }

      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
      }

      .markdown-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .file-list-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin-bottom: 12px;
        padding-left: 10px;
        direction: rtl;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .file-list-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .file-list-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .file-list-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      .file-list-scroll::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }

      .file-list-scroll > * {
        direction: ltr;
      }

      .sidebar-footer {
        flex-shrink: 0;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .bottom-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .bottom-row .theme-group {
        flex: 1;
        min-width: 0;
      }

      .bottom-row .sidebar-toggle {
        width: 30px;
        height: 30px;
      }

      .sidebar-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .about-dialog {
        width: min(90vw, 360px);
        padding: 28px 24px 24px;
        border: none;
        border-radius: 20px;
        background: var(--panel);
        color: var(--text);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .about-dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      .about-mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .about-dialog h2 {
        margin: 0 0 8px;
      }

      .about-dialog p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
      }

      .about-links {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
      }

      .about-links a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
      }

      .about-links a svg {
        flex-shrink: 0;
        color: var(--muted);
      }

      .about-links a:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .about-links a:hover svg {
        color: var(--accent);
      }

      .about-license {
        margin: 0 0 20px;
        font-size: 0.8rem;
      }

      .about-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 28px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }

      .about-close:hover {
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .theme-group {
        display: flex;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
      }

      .theme-btn {
        flex: 1;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .theme-btn:hover {
        color: var(--accent);
      }

      .theme-btn.active {
        background: var(--accent-soft);
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .action-btn {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .open-menu {
        position: relative;
      }

      .open-menu-list {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .open-menu-list[hidden] {
        display: none;
      }

      .menu-item {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .action-btn:hover {
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .primary-btn {
        text-align: center;
        font-weight: 600;
        border-radius: 999px;
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-contrast);
      }

      .primary-btn:hover {
        filter: brightness(1.08);
        border-color: var(--accent);
        color: var(--accent-contrast);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 16px;
      }

      .sidebar-header h2 {
        margin: 0;
      }

      .layout {
        transition: grid-template-columns 0.2s ease;
      }

      .sidebar-toggle {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }

      .sidebar-toggle:hover {
        background: var(--accent-soft);
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .layout.sidebar-collapsed {
        --sidebar-w: 44px;
      }

      .layout.sidebar-collapsed .sidebar {
        padding: 20px 6px;
        overflow: hidden;
        justify-content: flex-end;
        cursor: pointer;
      }

      .layout.sidebar-collapsed .sidebar-header,
      .layout.sidebar-collapsed .file-list-scroll,
      .layout.sidebar-collapsed .search,
      .layout.sidebar-collapsed .theme-group,
      .layout.sidebar-collapsed .open-menu,
      .layout.sidebar-collapsed .action-btn,
      .layout.sidebar-collapsed .about-btn {
        display: none;
      }

      .layout.sidebar-collapsed .sidebar-footer {
        padding-top: 0;
        border-top: none;
      }

      .layout.sidebar-collapsed .bottom-row {
        justify-content: center;
      }

      .markdown-body .mermaid,
      .mermaid-modal .mermaid {
        margin: 1em 0;
        text-align: center;
        overflow: auto;
      }

      .mermaid-wrap {
        margin: 1em 0;
      }

      .mermaid-wrap .mermaid {
        margin: 0;
      }

      .mermaid-toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        margin-bottom: 4px;
      }

      .mermaid-toolbar button {
        min-width: 28px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        cursor: pointer;
        font-size: 0.85rem;
      }

      .mermaid-toolbar button:hover {
        border-color: var(--accent-border);
        color: var(--accent);
      }

      .mermaid-zoom-label {
        min-width: 52px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .markdown-body .mermaid.is-zoomed,
      .mermaid-modal .mermaid.is-zoomed {
        cursor: grab;
      }

      .markdown-body .mermaid.is-panning,
      .mermaid-modal .mermaid.is-panning {
        cursor: grabbing;
        user-select: none;
      }

      .mermaid-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 1000;
      }

      .mermaid-modal {
        width: min(94vw, 1400px);
        height: min(90vh, 900px);
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .mermaid-modal .mermaid-toolbar {
        margin-bottom: 0;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }

      .mermaid-modal .mermaid {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 16px;
      }

      .mermaid-modal-close {
        font-size: 1rem;
        line-height: 1;
      }

      .markdown-body .mermaid svg,
      .mermaid-modal .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      @media (max-width: 1300px) {
        .toc-panel {
          display: none;
        }

        .layout.has-toc {
          --toc-w: 0px;
        }
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
          overflow: visible;
        }

        .file-list-scroll {
          max-height: 40vh;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        .content {
          padding: 18px 16px 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>MarkRead</h2>
        </div>
        <div class="file-list-scroll">
          <ul id="fileList" class="doc-list"></ul>
        </div>
        <div class="sidebar-footer">
          <input id="searchInput" class="search" type="search" placeholder="Filter files..." aria-label="Filter docs" />
        <div class="sidebar-actions">
          <input id="filePicker" type="file" accept=".md, text/markdown" multiple webkitdirectory style="display: none;" />
          <input id="filePickerFile" type="file" accept=".md, text/markdown" multiple style="display: none;" />
          <div class="open-menu">
            <button id="openBtn" type="button" class="action-btn primary-btn" aria-haspopup="true" aria-expanded="false">Open Markdown file(s) or folder</button>
            <div id="openMenu" class="open-menu-list" hidden>
              <button id="loadFolderBtn" type="button" class="menu-item">Folder</button>
              <button id="loadFileBtn" type="button" class="menu-item">File(s)</button>
            </div>
          </div>
          <div class="bottom-row">
          <div class="theme-group" role="group" aria-label="Theme">
            <button type="button" class="theme-btn" data-theme-option="light" title="Light theme" aria-label="Light theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
            <button type="button" class="theme-btn" data-theme-option="dark" title="Dark theme" aria-label="Dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button type="button" class="theme-btn" data-theme-option="paper" title="Paper theme" aria-label="Paper theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg></button>
          </div>
          <button id="aboutBtn" class="sidebar-toggle about-btn" type="button" aria-haspopup="dialog" title="About MarkRead" aria-label="About MarkRead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
          <button id="toggleSidebarBtn" class="sidebar-toggle" type="button" aria-expanded="true" title="Hide files">&laquo;</button>
          </div>
          <button id="reopenLastBtn" type="button" class="action-btn" hidden>Reopen last selection</button>
        </div>
        </div>
      </aside>

      <dialog id="aboutDialog" class="about-dialog">
        <div class="about-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <h2>MarkRead</h2>
        <p>A lightweight, browser-based Markdown reader. Your files are read locally in the browser and are never uploaded.</p>
        <ul class="about-links">
          <li><a href="https://github.com/hmv-workspace" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>hmv-workspace on GitHub</a></li>
          <li><a href="https://github.com/hmv-workspace/MarkRead" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Source code</a></li>
          <li><a href="https://github.com/hmv-workspace/MarkRead/issues" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Report an issue or suggestion</a></li>
        </ul>
        <p class="about-license">MIT License</p>
        <button type="button" id="aboutCloseBtn" class="about-close">Close</button>
      </dialog>

      <main class="content">
        <div class="doc-column">
          <header class="doc-header" hidden>
            <h1 id="docTitle">Loading document...</h1>
          </header>
          <article id="markdownView" class="markdown-body"></article>
        </div>
      </main>
      <nav id="tocPanel" class="toc-panel" aria-label="Table of contents" hidden>
        <strong>On this page</strong>
        <ul id="tocList"></ul>
      </nav>
    </div>

    <script>
      const manifestPath = './markdown-files.json';
      const fileList = document.getElementById('fileList');
      const markdownView = document.getElementById('markdownView');
      const docTitle = document.getElementById('docTitle');
      const searchInput = document.getElementById('searchInput');
      const filePicker = document.getElementById('filePicker');
      const loadFolderBtn = document.getElementById('loadFolderBtn');
      const filePickerFile = document.getElementById('filePickerFile');
      const loadFileBtn = document.getElementById('loadFileBtn');
      const openBtn = document.getElementById('openBtn');
      const openMenu = document.getElementById('openMenu');
      const reopenLastBtn = document.getElementById('reopenLastBtn');
      const tocPanel = document.getElementById('tocPanel');
      const tocList = document.getElementById('tocList');
      const aboutBtn = document.getElementById('aboutBtn');
      const aboutDialog = document.getElementById('aboutDialog');
      const aboutCloseBtn = document.getElementById('aboutCloseBtn');
      const supportsFileSystemAccess = typeof window.showDirectoryPicker === 'function' && typeof window.showOpenFilePicker === 'function';
      const SELECTION_DB = 'docs-markdown-viewer';
      const SELECTION_STORE = 'selections';
      const LAST_SELECTION_KEY = 'last';
      const themeButtons = document.querySelectorAll('[data-theme-option]');
      let lastDocument = null;
      let docs = [];
      let selectedFile = '';
      const isLocalFileMode = location.protocol === 'file:';

      const THEME_KEY = 'docs-viewer-theme';
      const mermaidThemes = { light: 'default', dark: 'dark', paper: 'neutral' };

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeButtons.forEach((button) => button.classList.toggle('active', button.dataset.themeOption === theme));
        if (typeof mermaid !== 'undefined') {
          mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mermaidThemes[theme] || 'default' });
        }
      }

      applyTheme(localStorage.getItem(THEME_KEY) || 'light');

      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
        marked.use({
          renderer: {
            code({ text, lang }) {
              const language = (lang || '').trim().split(/\s+/)[0];
              const langClass = language ? ` language-${language}` : '';
              if (language === 'mermaid') {
                return `<pre><code class="language-mermaid">${escapeHtml(text)}</code></pre>\n`;
              }
              try {
                const highlighted = hljs.getLanguage(language)
                  ? hljs.highlight(text, { language }).value
                  : hljs.highlightAuto(text).value;
                return `<pre><code class="hljs${langClass}">${highlighted}</code></pre>\n`;
              } catch (error) {
                return `<pre><code class="${langClass.trim()}">${escapeHtml(text)}</code></pre>\n`;
              }
            },
          },
        });
      }

      function getDisplayName(file) {
        return typeof file === 'string' ? file.replace(/^.*\//, '') : (file.name || 'document.md').replace(/^.*\//, '');
      }

      function renderFileList() {
        const query = searchInput.value.trim().toLowerCase();
        const filteredDocs = docs.filter((file) => getDisplayName(file).toLowerCase().includes(query));

        fileList.innerHTML = filteredDocs.map((file) => {
          const label = getDisplayName(file);
          const key = typeof file === 'string' ? file : file.name;
          const isSelected = key === selectedFile ? 'active' : '';
          return `
            <li>
              <button class="doc-link ${isSelected}" data-file="${key}">
                <svg class="doc-link-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="doc-link-label">${label}</span>
              </button>
            </li>
          `;
        }).join('') || '<li><span style="color: var(--muted);">No files match.</span></li>';

        fileList.querySelectorAll('.doc-link').forEach((button) => {
          button.addEventListener('click', async () => {
            const key = button.dataset.file;
            const doc = docs.find((item) => (typeof item === 'string' ? item : item.name) === key);
            await loadDocument(doc || key);
          });
        });
      }

      async function renderMermaidBlocks(container) {
        const codeBlocks = container.querySelectorAll('pre > code.language-mermaid');
        if (!codeBlocks.length || typeof mermaid === 'undefined') {
          return;
        }

        const nodes = [];
        codeBlocks.forEach((code) => {
          const diagram = document.createElement('div');
          diagram.className = 'mermaid';
          diagram.textContent = code.textContent;
          const wrapper = document.createElement('div');
          wrapper.className = 'mermaid-wrap';
          wrapper.dataset.zoom = '1';
          wrapper.innerHTML = '<div class="mermaid-toolbar"><button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out">-</button><span class="mermaid-zoom-label">100%</span><button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button><button type="button" data-zoom="reset" title="Reset zoom" aria-label="Reset zoom">Reset</button><button type="button" data-action="expand" title="View fullscreen" aria-label="View fullscreen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button></div>';
          wrapper.appendChild(diagram);
          code.parentElement.replaceWith(wrapper);
          nodes.push(diagram);
        });

        try {
          await mermaid.run({ nodes });
        } catch (error) {
          console.error('Mermaid rendering failed:', error);
        }
      }

      function openSelectionDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(SELECTION_DB, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(SELECTION_STORE);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function saveLastSelection(selection) {
        const db = await openSelectionDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(SELECTION_STORE, 'readwrite');
          tx.objectStore(SELECTION_STORE).put(selection, LAST_SELECTION_KEY);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      }

      async function readLastSelection() {
        const db = await openSelectionDb();
        const selection = await new Promise((resolve, reject) => {
          const request = db.transaction(SELECTION_STORE).objectStore(SELECTION_STORE).get(LAST_SELECTION_KEY);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return selection || null;
      }

      function getSelectionHandles(selection) {
        return selection.type === 'folder' ? [selection.handle] : selection.handles;
      }

      async function collectMarkdownEntries(dirHandle, prefix = '') {
        const entries = [];
        for await (const handle of dirHandle.values()) {
          if (handle.kind === 'directory') {
            if (!handle.name.startsWith('.')) {
              entries.push(...(await collectMarkdownEntries(handle, `${prefix}${handle.name}/`)));
            }
          } else if (handle.name.toLowerCase().endsWith('.md')) {
            entries.push({ name: `${prefix}${handle.name}`, handle });
          }
        }
        return entries.sort((a, b) => a.name.localeCompare(b.name));
      }

      async function loadSelection(selection) {
        const entries = selection.type === 'folder'
          ? await collectMarkdownEntries(selection.handle)
          : selection.handles.map((handle) => ({ name: handle.name, handle }));

        if (!entries.length) {
          clearToc();
          markdownView.innerHTML = '<p style="color: #b42318;">No Markdown files were found in the selection.</p>';
          docTitle.textContent = 'No files selected';
          return;
        }

        docs = entries;
        renderFileList();
        await loadDocument(docs[0]);
      }

      async function pickFolder() {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        const selection = { type: 'folder', handle: dirHandle };
        await saveLastSelection(selection);
        await loadSelection(selection);
      }

      async function pickFiles() {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: 'Markdown files', accept: { 'text/markdown': ['.md'] } }],
        });
        const selection = { type: 'files', handles };
        await saveLastSelection(selection);
        await loadSelection(selection);
      }

      async function runPicker(action) {
        try {
          await action();
        } catch (error) {
          if (error.name !== 'AbortError') {
            clearToc();
            markdownView.innerHTML = `<p style="color: #b42318;">The selection could not be opened: ${error.message}</p>`;
          }
        }
      }

      async function restoreLastSelection() {
        const selection = await readLastSelection();
        if (!selection) {
          return false;
        }

        const permissionStates = await Promise.all(
          getSelectionHandles(selection).map((handle) => handle.queryPermission({ mode: 'read' }))
        );
        if (permissionStates.every((state) => state === 'granted')) {
          await loadSelection(selection);
          return true;
        }

        reopenLastBtn.hidden = false;
        docTitle.textContent = 'Reopen your last selection';
        markdownView.innerHTML = '<p>Click "Reopen last selection" to continue.</p>';
        return true;
      }

      function findDocument(path) {
        const normalizedPath = path.toLowerCase();
        const exactMatch = docs.find((item) => (typeof item === 'string' ? item : item.name).toLowerCase() === normalizedPath);
        if (exactMatch) {
          return exactMatch;
        }

        const baseName = normalizedPath.replace(/^.*\//, '');
        return docs.find((item) => getDisplayName(item).toLowerCase() === baseName) || null;
      }

      function addHeadingIds(container) {
        container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
          if (!heading.id) {
            heading.id = heading.textContent.trim().toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
          }
        });
      }

      function clearToc() {
        tocPanel.hidden = true;
        tocList.innerHTML = '';
        document.querySelector('.layout').classList.remove('has-toc');
      }

      function buildToc(container) {
        const headings = Array.from(container.querySelectorAll('h1, h2, h3')).filter((heading) => heading.id);
        if (headings.length < 3) {
          clearToc();
          return;
        }

        tocList.innerHTML = headings.map((heading) => {
          const level = Number(heading.tagName[1]);
          return `<li class="toc-level-${level}"><a href="#${heading.id}">${heading.textContent}</a></li>`;
        }).join('');
        tocPanel.hidden = false;
        document.querySelector('.layout').classList.add('has-toc');
      }

      tocList.addEventListener('click', (event) => {
        const link = event.target.closest('a[href^="#"]');
        if (!link) {
          return;
        }
        event.preventDefault();
        document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      function addCopyButtons(container) {
        container.querySelectorAll('pre > code').forEach((code) => {
          const pre = code.parentElement;
          const wrapper = document.createElement('div');
          wrapper.className = 'code-block-wrap';
          pre.replaceWith(wrapper);
          wrapper.appendChild(pre);

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'copy-code-btn';
          button.textContent = 'Copy';
          button.setAttribute('aria-label', 'Copy code to clipboard');
          wrapper.appendChild(button);
        });
      }

      markdownView.addEventListener('click', async (event) => {
        const button = event.target.closest('.copy-code-btn');
        if (!button) {
          return;
        }
        const code = button.closest('.code-block-wrap')?.querySelector('code');
        if (!code) {
          return;
        }
        try {
          await navigator.clipboard.writeText(code.textContent);
          button.textContent = 'Copied!';
        } catch (error) {
          button.textContent = 'Failed';
        }
        setTimeout(() => { button.textContent = 'Copy'; }, 1500);
      });

      async function renderMarkdown(markdown) {
        const rawHtml = marked.parse(markdown, { breaks: true, gfm: true });
        markdownView.innerHTML = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target'] });
        addHeadingIds(markdownView);
        buildToc(markdownView);
        await renderMermaidBlocks(markdownView);
        addCopyButtons(markdownView);
      }

      const FILE_WATCH_INTERVAL_MS = 1500;
      let watchIntervalId = null;
      let watchedHandle = null;
      let watchedLastModified = null;

      function stopFileWatch() {
        clearInterval(watchIntervalId);
        watchIntervalId = null;
        watchedHandle = null;
        watchedLastModified = null;
      }

      function startFileWatch(handle, lastModified) {
        stopFileWatch();
        watchedHandle = handle;
        watchedLastModified = lastModified;
        watchIntervalId = setInterval(refreshIfChanged, FILE_WATCH_INTERVAL_MS);
      }

      async function refreshIfChanged() {
        if (!watchedHandle) {
          return;
        }
        try {
          const fsFile = await watchedHandle.getFile();
          if (fsFile.lastModified === watchedLastModified) {
            return;
          }
          watchedLastModified = fsFile.lastModified;
          const pane = document.querySelector('.content');
          const scrollTop = pane.scrollTop;
          await renderMarkdown(await fsFile.text());
          pane.scrollTop = scrollTop;
        } catch (error) {
          console.error('Auto-refresh failed:', error);
        }
      }

      async function loadDocument(file, hash = '') {
        const key = typeof file === 'string' ? file : file.name;
        selectedFile = key;
        lastDocument = file;
        docTitle.textContent = getDisplayName(file);
        markdownView.innerHTML = '<p>Loading...</p>';
        renderFileList();

        try {
          let markdown = '';

          if (file.handle) {
            const fsFile = await file.handle.getFile();
            markdown = await fsFile.text();
            startFileWatch(file.handle, fsFile.lastModified);
          } else if (file instanceof File) {
            stopFileWatch();
            markdown = await file.text();
          } else if (typeof file === 'string' && !isLocalFileMode) {
            stopFileWatch();
            const response = await fetch(`./${file}`);
            if (!response.ok) {
              throw new Error(`Unable to load ${file}`);
            }
            markdown = await response.text();
          } else {
            stopFileWatch();
            throw new Error('This file cannot be loaded directly from the local file system. Please open a docs folder using the button above.');
          }

          await renderMarkdown(markdown);
          window.scrollTo(0, 0);
          if (hash) {
            document.getElementById(decodeURIComponent(hash.slice(1)))?.scrollIntoView();
          }
        } catch (error) {
          stopFileWatch();
          clearToc();
          markdownView.innerHTML = `<p style="color: #b42318;">The file could not be loaded: ${error.message}</p>`;
        }
      }

      async function loadFolderFiles(fileListInput) {
        const files = Array.from(fileListInput.files || []).filter((file) => file.name.toLowerCase().endsWith('.md'));
        fileListInput.value = '';

        if (!files.length) {
          clearToc();
          markdownView.innerHTML = '<p style="color: #b42318;">No Markdown files were selected.</p>';
          docTitle.textContent = 'No files selected';
          return;
        }

        docs = files.sort((a, b) => a.name.localeCompare(b.name));
        renderFileList();
        await loadDocument(files[0]);
      }

      async function init() {
        if (supportsFileSystemAccess && (await restoreLastSelection().catch(() => false))) {
          return;
        }
        try {
          if (isLocalFileMode) {
            docTitle.textContent = 'Open a docs folder';
            markdownView.innerHTML = '<p>Select a folder containing Markdown files to begin.</p>';
            return;
          }

          const response = await fetch(manifestPath).catch(() => null);
          if (!response || !response.ok) {
            docTitle.textContent = 'Open a docs folder';
            markdownView.innerHTML = '<p>Use Open in the left panel to choose a folder or Markdown files to begin.</p>';
            return;
          }

          const manifest = await response.json();
          docs = manifest || [];
          if (!docs.length) {
            throw new Error('No Markdown files were found in the docs index.');
          }

          renderFileList();
          await loadDocument(docs[0]);
        } catch (error) {
          clearToc();
          markdownView.innerHTML = `<p style="color: #b42318;">${error.message}</p>`;
          docTitle.textContent = 'Documentation unavailable';
        }
      }

      async function setTheme(theme) {
        localStorage.setItem(THEME_KEY, theme);
        applyTheme(theme);
        if (lastDocument) {
          const pane = document.querySelector('.content');
          const scrollTop = pane.scrollTop;
          await loadDocument(lastDocument);
          pane.scrollTop = scrollTop;
        }
      }

      themeButtons.forEach((button) => button.addEventListener('click', () => setTheme(button.dataset.themeOption)));

      const MERMAID_ZOOM_MIN = 0.25;
      const MERMAID_ZOOM_MAX = 3;
      const MERMAID_ZOOM_STEP = 0.25;

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-zoom]');
        if (!button) {
          return;
        }

        const wrapper = button.closest('.mermaid-wrap');
        const current = Number(wrapper.dataset.zoom || 1);
        let next = 1;
        if (button.dataset.zoom === 'in') {
          next = Math.min(MERMAID_ZOOM_MAX, current + MERMAID_ZOOM_STEP);
        } else if (button.dataset.zoom === 'out') {
          next = Math.max(MERMAID_ZOOM_MIN, current - MERMAID_ZOOM_STEP);
        }

        wrapper.dataset.zoom = String(next);
        const svg = wrapper.querySelector('.mermaid svg');
        if (svg) {
          svg.style.maxWidth = 'none';
          svg.style.width = `${Math.round(next * 100)}%`;
        }
        wrapper.querySelector('.mermaid').classList.toggle('is-zoomed', next > 1);
        wrapper.querySelector('.mermaid-zoom-label').textContent = `${Math.round(next * 100)}%`;
      });

      let mermaidPan = null;

      document.addEventListener('pointerdown', (event) => {
        const area = event.target.closest('.mermaid.is-zoomed');
        if (!area || event.button !== 0) {
          return;
        }
        mermaidPan = { area, x: event.clientX, y: event.clientY, left: area.scrollLeft, top: area.scrollTop };
        area.classList.add('is-panning');
        area.setPointerCapture(event.pointerId);
      });

      document.addEventListener('pointermove', (event) => {
        if (!mermaidPan) {
          return;
        }
        mermaidPan.area.scrollLeft = mermaidPan.left - (event.clientX - mermaidPan.x);
        mermaidPan.area.scrollTop = mermaidPan.top - (event.clientY - mermaidPan.y);
      });

      const endMermaidPan = () => {
        if (!mermaidPan) {
          return;
        }
        mermaidPan.area.classList.remove('is-panning');
        mermaidPan = null;
      };
      document.addEventListener('pointerup', endMermaidPan);
      document.addEventListener('pointercancel', endMermaidPan);

      function closeMermaidModal() {
        const overlay = document.querySelector('.mermaid-modal-overlay');
        if (!overlay) {
          return;
        }
        overlay.remove();
        document.body.style.overflow = '';
        document.removeEventListener('keydown', onMermaidModalKeydown);
      }

      function onMermaidModalKeydown(event) {
        if (event.key === 'Escape') {
          closeMermaidModal();
        }
      }

      function openMermaidModal(sourceWrapper) {
        const svg = sourceWrapper.querySelector('.mermaid svg');
        if (!svg) {
          return;
        }

        const overlay = document.createElement('div');
        overlay.className = 'mermaid-modal-overlay';
        overlay.innerHTML = `
          <div class="mermaid-wrap mermaid-modal" data-zoom="1" role="dialog" aria-modal="true" aria-label="Diagram view">
            <div class="mermaid-toolbar">
              <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out">-</button>
              <span class="mermaid-zoom-label">100%</span>
              <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
              <button type="button" data-zoom="reset" title="Reset zoom" aria-label="Reset zoom">Reset</button>
              <button type="button" class="mermaid-modal-close" title="Close" aria-label="Close">&times;</button>
            </div>
            <div class="mermaid"></div>
          </div>
        `;

        overlay.querySelector('.mermaid').appendChild(svg.cloneNode(true));
        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) {
            closeMermaidModal();
          }
        });
        overlay.querySelector('.mermaid-modal-close').addEventListener('click', closeMermaidModal);

        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', onMermaidModalKeydown);
      }

      markdownView.addEventListener('click', (event) => {
        const button = event.target.closest('[data-action="expand"]');
        if (!button) {
          return;
        }
        openMermaidModal(button.closest('.mermaid-wrap'));
      });

      markdownView.addEventListener('click', async (event) => {
        const link = event.target.closest('a[href]');
        if (!link) {
          return;
        }

        const href = link.getAttribute('href');
        if (href.startsWith('#')) {
          return;
        }

        const isAbsolute = /^[a-z][a-z0-9+.-]*:/i.test(href);
        const currentDocUrl = `https://docs.local/${selectedFile.split('/').map(encodeURIComponent).join('/')}`;
        const url = new URL(href, currentDocUrl);
        const targetPath = decodeURIComponent(url.pathname).replace(/^\//, '');
        const doc = !isAbsolute && /\.md$/i.test(targetPath) ? findDocument(targetPath) : null;

        event.preventDefault();
        if (doc) {
          await loadDocument(doc, url.hash);
        } else {
          window.open(link.href, '_blank', 'noopener,noreferrer');
        }
      });

      const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
      const sidebar = document.querySelector('.sidebar');
      const layout = document.querySelector('.layout');

      function setSidebarCollapsed(collapsed) {
        layout.classList.toggle('sidebar-collapsed', collapsed);
        toggleSidebarBtn.textContent = collapsed ? '\u00BB' : '\u00AB';
        toggleSidebarBtn.title = collapsed ? 'Show files' : 'Hide files';
        toggleSidebarBtn.setAttribute('aria-expanded', String(!collapsed));
      }

      toggleSidebarBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        setSidebarCollapsed(!layout.classList.contains('sidebar-collapsed'));
      });

      sidebar.addEventListener('click', () => {
        if (layout.classList.contains('sidebar-collapsed')) {
          setSidebarCollapsed(false);
        }
      });

      loadFolderBtn.addEventListener('click', () => (supportsFileSystemAccess ? runPicker(pickFolder) : filePicker.click()));
      filePicker.addEventListener('change', () => loadFolderFiles(filePicker));
      openBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        const willOpen = openMenu.hidden;
        openMenu.hidden = !willOpen;
        openBtn.setAttribute('aria-expanded', String(willOpen));
      });

      document.addEventListener('click', () => {
        openMenu.hidden = true;
        openBtn.setAttribute('aria-expanded', 'false');
      });

      loadFileBtn.addEventListener('click', () => (supportsFileSystemAccess ? runPicker(pickFiles) : filePickerFile.click()));
      reopenLastBtn.addEventListener('click', () => runPicker(async () => {
        const selection = await readLastSelection();
        for (const handle of getSelectionHandles(selection)) {
          if ((await handle.requestPermission({ mode: 'read' })) !== 'granted') {
            throw new Error('Read permission was not granted.');
          }
        }
        reopenLastBtn.hidden = true;
        await loadSelection(selection);
      }));
      filePickerFile.addEventListener('change', () => loadFolderFiles(filePickerFile));
      searchInput.addEventListener('input', renderFileList);

      aboutBtn.addEventListener('click', () => aboutDialog.showModal());
      aboutCloseBtn.addEventListener('click', () => aboutDialog.close());
      aboutDialog.addEventListener('click', (event) => {
        if (event.target === aboutDialog) {
          aboutDialog.close();
        }
      });

      init();
    </script>
  </body>
</html>
